name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read   # only the release job at the bottom writes, and it asks for that itself

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  engine:
    name: Engine tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install engine + test deps
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest

  app:
    name: App analyze + tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The engine-client tests that spawn a real engine rely on the locator's
      # PATH fallback, so `python -m ipaside_engine` must be importable.
      - name: Install engine + test deps
        run: python -m pip install -r requirements-dev.txt

      # Flutter plugins are wired up with symlinks on Windows, which needs the
      # developer-mode privilege. Runners are administrators, so set it here.
      - name: Enable symlink support
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - name: Analyze (lints are errors)
        working-directory: src/iPASide.Flutter
        run: flutter analyze --fatal-infos

      - name: Run tests
        working-directory: src/iPASide.Flutter
        run: flutter test

  build:
    name: Build installer
    runs-on: windows-latest
    needs: [engine, app]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      # The release is named after the tag, but the running app reports its own compiled-in
      # version. If they differ, every installed copy installs the update, restarts, still sees
      # an older version and is offered the same update forever. So a tag must equal the app
      # version, and this fails the run before any installer is built.
      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' src/iPASide.Flutter/pubspec.yaml | head -n1)"
          eng="$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' src/iPASide.Engine/ipaside_engine/__init__.py | head -n1)"
          echo "tag=$tag pubspec=$pub engine=$eng"
          if [ -z "$pub" ] || [ -z "$eng" ] || [ "$tag" != "$pub" ] || [ "$tag" != "$eng" ]; then
            echo "::error::Tag v$tag must equal version in pubspec.yaml ($pub) and ipaside_engine/__init__.py ($eng). Bump them, then re-tag."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Enable symlink support
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      # Build zsign.exe from source (SHA256 + DER), the way the app expects it.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib mingw-w64-x86_64-minizip mingw-w64-x86_64-pkgconf
      - name: Build zsign
        shell: msys2 {0}
        run: bash tools/zsign/build-zsign.sh

      # iOS 10 and earlier only verify a SHA-1 signature, and iPASide asks zsign for one with -L
      # (issue #11). This job is where the signer exists, so a signer that ever loses the option
      # fails the build here instead of failing on somebody's iPad.
      - name: Check zsign can sign for iOS 10 and earlier
        shell: bash
        run: |
          zsign=src/iPASide.Engine/ipaside_engine/vendor/zsign.exe
          test -f "$zsign"
          # zsign exits non-zero after printing its usage, so read the text and ignore the status.
          help_text="$("$zsign" -h 2>&1 || true)"
          grep -q -- "--legacy_sha1" <<< "$help_text"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (portable engine + Flutter runner + Inno Setup)
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0-ci' }
          .\packaging\build-installer.ps1 -Version $v -Python python

      # Tags build here too, so a release is always proven to build on a clean
      # machine, and the result is downloadable for inspection or comparison.
      - uses: actions/upload-artifact@v7
        with:
          name: EZSide-installer
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

  # CI is the only producer of EZSide releases. Exactly one build may ever reach a
  # release: this job publishes the installer the build job just made, on a `v*`
  # tag push and nowhere else, and nobody uploads to a release by hand. Uploads
  # overwrite same-named assets, so a second producer would replace the installer
  # and rewrite SHA256SUMS.txt; the updater is fail-closed on a checksum mismatch,
  # so any mismatch between the two leaves users unable to update at all. This is
  # the only job with write access. See docs/releasing.md.
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: EZSide-installer
          path: dist/installer

      # Never overwrites: a release that already has assets may be installed on real machines,
      # and replacing the exe and the sums one after the other would break the updater between
      # the two uploads. To re-cut a version, delete its release and tag first (docs/releasing.md).
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          ver="${tag#v}"
          setup="dist/installer/EZSide-Setup-${ver}-x64.exe"
          sums="dist/installer/SHA256SUMS.txt"
          test -f "$setup"
          test -f "$sums"
          pre=""
          case "$ver" in *-*) pre="--prerelease" ;; esac
          if existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null)"; then
            if [ "$existing" != "0" ]; then
              echo "::error::Release $tag already has $existing asset(s). Refusing to overwrite. Delete the release and tag first, or ship a new version."
              exit 1
            fi
            gh release upload "$tag" "$setup" "$sums" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$setup" "$sums" --verify-tag $pre \
              --title "EZSide $ver" --notes "EZSide $ver" --repo "$GITHUB_REPOSITORY"
          fi
